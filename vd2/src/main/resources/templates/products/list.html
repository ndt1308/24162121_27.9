<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Sản phẩm')}"></head>
<body>
	<header th:replace="~{fragments/header :: header}"></header>
	<main class="container">
		<div class="page-title">
			<h1>Sản phẩm</h1>
			<a class="btn primary" th:href="@{/products/new}">+ Thêm sản phẩm</a>
		</div>
		<div th:replace="~{fragments/alerts :: alerts}"></div>

		<form class="search" th:action="@{/products}" method="get">
			<input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên sản phẩm">
			<button class="btn primary" type="submit">Tìm</button>
		</form>

		<div class="table-wrap">
			<table>
				<thead>
					<tr><th>Ảnh</th><th>Tên</th><th>Giá</th><th>Chủ sở hữu</th><th>Thao tác</th></tr>
				</thead>
				<tbody>
					<tr th:each="p : ${page.content}">
						<td><img class="thumb" th:if="${p.imageUrl}" th:src="${p.imageUrl}" alt="ảnh"></td>
						<td>
							<b th:text="${p.name}">name</b><br>
							<small th:text="${p.description}">desc</small>
						</td>
						<td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0</td>
						<td th:text="${p.ownerName}">owner</td>
						<td class="actions">
							<a class="btn secondary small" th:href="@{/products/{id}/edit(id=${p.id})}">Sửa</a>
							<form th:action="@{/products/{id}/delete(id=${p.id})}" method="post" style="display: inline"
								onsubmit="return confirm('Xóa sản phẩm này?')">
								<button class="btn danger small" type="submit">Xóa</button>
							</form>
						</td>
					</tr>
					<tr th:if="${page.empty}"><td colspan="5">Không có dữ liệu</td></tr>
				</tbody>
			</table>
		</div>
		<div th:replace="~{fragments/pagination :: pager(${page}, '/products', ${keyword})}"></div>
	</main>
</body>
</html>
