<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Xác thực OTP')}"></head>
<body class="auth-page">
	<div class="auth-card">
		<h1>IOTSTAR SHOP</h1>
		<h2>Xác thực OTP</h2>
		<p>Mã gồm 6 chữ số đã được gửi tới <b th:text="${email}">email</b></p>
		<div th:replace="~{fragments/alerts :: alerts}"></div>
		<form th:action="@{/verify-otp}" method="post">
			<input type="hidden" name="email" th:value="${email}">
			<label>Mã OTP</label>
			<input type="text" name="code" maxlength="6" pattern="\d{6}" inputmode="numeric" required autofocus>
			<button class="btn primary full mt" type="submit">Xác nhận</button>
		</form>
		<form th:action="@{/register/resend-otp}" method="post" class="mt">
			<input type="hidden" name="email" th:value="${email}">
			<button class="btn secondary full" type="submit">Gửi lại mã</button>
		</form>
	</div>
</body>
</html>
