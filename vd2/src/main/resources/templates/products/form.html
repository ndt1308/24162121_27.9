<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Sản phẩm')}"></head>
<body>
	<header th:replace="~{fragments/header :: header}"></header>
	<main class="container narrow">
		<div class="panel">
			<h1 th:text="${product.id == null} ? 'Thêm sản phẩm' : 'Sửa sản phẩm'">Sản phẩm</h1>
			<div th:replace="~{fragments/alerts :: alerts}"></div>
			<form th:action="@{${product.id == null ? '/products' : '/products/' + product.id}}"
				th:object="${product}" method="post" enctype="multipart/form-data" class="form-grid">
				<input type="hidden" th:field="*{imageUrl}">

				<label>Tên sản phẩm</label>
				<div>
					<input type="text" th:field="*{name}" required>
					<span class="field-error" th:errors="*{name}"></span>
				</div>

				<label>Giá</label>
				<div>
					<input type="number" step="0.01" min="0" th:field="*{price}" required>
					<span class="field-error" th:errors="*{price}"></span>
				</div>

				<label>Mô tả</label>
				<div>
					<textarea rows="4" th:field="*{description}"></textarea>
					<span class="field-error" th:errors="*{description}"></span>
				</div>

				<label>Ảnh</label>
				<div>
					<img class="thumb" th:if="${product.imageUrl}" th:src="${product.imageUrl}" alt="ảnh hiện tại"><br>
					<input type="file" name="file" accept="image/*">
				</div>

				<div>
					<button class="btn primary" type="submit">Lưu</button>
					<a class="btn secondary" th:href="@{/products}">Hủy</a>
				</div>
			</form>
		</div>
	</main>
</body>
</html>
