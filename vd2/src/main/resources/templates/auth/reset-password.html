<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>
<body class="auth-page">
	<div class="auth-card">
		<h1>IOTSTAR SHOP</h1>
		<h2>Đặt lại mật khẩu</h2>
		<div th:replace="~{fragments/alerts :: alerts}"></div>
		<form th:action="@{/reset-password}" th:object="${resetDTO}" method="post">
			<input type="hidden" th:field="*{email}">
			<p>Email: <b th:text="*{email}">email</b></p>

			<label>Mã OTP</label>
			<input type="text" th:field="*{otp}" maxlength="6" inputmode="numeric" required autofocus>
			<div class="field-error" th:errors="*{otp}"></div>

			<label>Mật khẩu mới</label>
			<input type="password" th:field="*{newPassword}" required>
			<div class="field-error" th:errors="*{newPassword}"></div>

			<label>Nhập lại mật khẩu</label>
			<input type="password" th:field="*{confirmPassword}" required>
			<div class="field-error" th:errors="*{confirmPassword}"></div>

			<button class="btn primary full mt" type="submit">Đổi mật khẩu</button>
		</form>
		<p><a th:href="@{/forgot-password}">Gửi lại mã</a> &middot; <a th:href="@{/login}">Đăng nhập</a></p>
	</div>
</body>
</html>
