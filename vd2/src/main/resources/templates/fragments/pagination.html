<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<nav th:fragment="pager(page, url, keyword)" class="pagination" th:if="${page.totalPages > 1}">
		<span th:if="${!page.first}"><a th:href="@{${url}(page=${page.number - 1}, keyword=${keyword})}">&laquo;</a></span>
		<span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
			th:classappend="${i == page.number} ? 'active'"><a
			th:href="@{${url}(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a></span>
		<span th:if="${!page.last}"><a th:href="@{${url}(page=${page.number + 1}, keyword=${keyword})}">&raquo;</a></span>
	</nav>
</body>
</html>
